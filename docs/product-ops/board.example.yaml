# Example board for Overlord.
#
# Two uses:
#   1. A starting point when you would rather write the first board by hand
#      than have the overlord-ops skill generate one.
#   2. The demo board used to take the screenshots in docs/images
#      (see docs/launch-demo.md).
#
# Every project, card, branch, pull request, and commit id below is invented.
# `commander` is intentionally absent: it holds cmux session ids that are
# local to one machine, and the console writes it for you when you register a
# commander from the sidebar.
#
# To use this file as your own board:
#   cp docs/product-ops/board.example.yaml docs/product-ops/board.yaml
# then replace `items` with your own cards. The schema is documented in
# skills/overlord-ops/references/board-schema.md.
