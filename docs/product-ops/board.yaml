items:
  - id: "OV-CON-001"
    project: "Overlord"
    title: "Overlord Console の導入（Artifact からの置き換え）"
    state: "reviewing"
    priority:
      impact: 5
      urgency: 4
      confidence: 5
      ease: 4
      override: null
    evidence: |-
      Artifact は claude.ai の CSP により 127.0.0.1 へ接続できず、cmux と連携できない。
      console/ に Bun 製のローカルサーバーと board.yaml ダッシュボードを追加し、
      5つのスキルと README から Artifact 手順を削除した。
      対話は司令塔1セッションに固定し、カードごとのセッション選択は廃止した。
      カードのボタンは司令塔への指示文を入力欄に入れるだけで、送信はユーザー操作に限る。
      実装者自身による動作確認は完了。独立レビューは未実施。作業ツリーは未コミット。
    acceptance_conditions:
      - "別セッションの AI による /product-change-review で止めるべき問題が残らない"
      - "実利用の1件で、カード移動と司令塔への送信が成功する"
      - "司令塔がサブエージェントを起動し、担当セッションがカードに記録される"
      - "変更がコミットされている"
    out_of_scope: "cmux 側の機能追加、board.yaml スキーマの再設計"
    owner: "user"
    next_action: "PR を確認し、必要なら PR 上で /product-change-review を実行する"
    blocker: "コミット可否のユーザー判断"
    updated_at: "2026-08-26T07:05:44Z"
  - id: "OV-CON-002"
    project: "Overlord"
    title: "エージェント画面のスクロールバックを UI から読めるようにする"
    state: "specified"
    priority:
      impact: 3
      urgency: 2
      confidence: 5
      ease: 5
      override: null
    evidence: |-
      サーバーは /api/cmux/screen で scrollback=1 を受け付けるが、
      console/public/app.js は lines=80 のみを渡しており、UI から呼べない。
      直前の出力しか見えないため、長い応答は cmux 側に切り替えて読む必要がある。
    acceptance_conditions:
      - "エージェントタブから、表示行数の拡大またはスクロールバック取得を選べる"
      - "取得中もカードの操作と送信が阻害されない"
    out_of_scope: "端末エスケープシーケンスの色再現"
    owner: null
    next_action: "実装ブリーフを作成する"
    blocker: null
