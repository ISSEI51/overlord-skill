    brief: |-
      採用案: board.ts に共通の書き込み口を作り、(i) プロセス内直列化 (ii) ロック内で loadBoard (iii) expectedRev 突き合わせ (iv) saveBoard を通す。あわせて revisionOf を mtimeNs:size に変更する（rev は不透明文字列として扱われており非互換なし — フロント・CLI とも等値比較のみであることを確認済み）。
      保存直前の再確認だけでは窓が 0.4〜2ms → 0.2〜1ms に縮むだけで「必ず 409」を保証できないため、ロックファイル（O_EXCL + 失効時間）まで入れて board.ts 経由の書き込みを直列化する。
      server.ts はモジュール読み込み時に引数解析と Bun.serve を実行する構造でテストの継ぎ目が無い。ロックがあれば「テストがロックを保持した状態で PATCH が 409 を返す」決定的なテストが書ける。
    review: |-
      C1（PR #5）/ C2（PR #7）ともマージ済み。独立レビューが実測で欠陥を確定させ、修正後の効果も再現した。
      2プロセス同時書き込み 50ラウンド: rename ENOENT 49/50→0/50、両プロセス正常終了 1/50→50/50、書き込み消失 49/50→0、board 破損 1/50→0（レビュー担当の計測）。
      C2 のレビュー指摘3件を修正: .gitignore の *.lock が追跡中の bun.lock を巻き込む（止めるべき問題）、取得デッドラインが実時間でスリープ中に経過し偽の競合になる、ロックの pid を書きながら読まず生存中のロックを壊す。
      テスト 95 pass / 0 fail。修正の差分（08a44af）は独立レビューを経ていないが、いずれもレビュー担当が実装方法まで指定した内容で、新規テストと競合再測で確認した。
