    project: "Overlord"
    title: "ボードの同時書き込みで更新が消えないようにする"
    state: "implementing"
    priority:
      impact: 4
      urgency: 3
      confidence: 5
      ease: 3
      override: null
    evidence: |-
      server.ts の patchItem/deleteItem/setCommander は loadBoard(208) → rev 比較(209) → saveBoard(224) の間に revision を再確認しない。競合窓は実測 0.4〜2ms。
      追加で判明した欠陥2件: (1) createItem(248-271) には rev 比較自体が無く常に後勝ちで全体を上書きする。(2) フロントの PATCH 呼び出しは await されていないため、同一プロセス内で重なった2本の PATCH でも先の変更が消える。
      revisionOf は round(mtimeMs):size で、stat がナノ秒精度を返せるのに 1ms に丸めている。同一ミリ秒・同一サイズの書き込みは 409 判定と SSE 通知の両方で取りこぼす。
      CLI 側（change.ts の updateChange）だけが保存直前の revision 再取得を持つ。守られていないのはサーバー側。
    acceptance_conditions:
      - "コンソールの PATCH と CLI の書き込みを100回競合させて、CLI の書き込みが消えるケースが0件（競合時は 409 になる）"
      - "同じ rev の PATCH を2本同時発行したとき、片方が 200・片方が 409 になり、消失が起きない"
      - "異なる内容で同一バイト長のファイルを同一ミリ秒内に2回書いて、revisionOf の戻り値が異なる"
      - "同一条件の書き込みが SSE の board イベントとして配信される"
      - "rev 形式変更後も typecheck と既存の change.test.ts が通る"
    out_of_scope: "board.yaml のスキーマ変更（rev カウンタ導入を含む）、CLI のコマンド体系や updateChange の再設計、HTTP API の形の変更、複数サーバーインスタンスの排他、競合時の UI 改善"
