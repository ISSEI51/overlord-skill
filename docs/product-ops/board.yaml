    brief: |-
      【ユーザー決定】未マージ change が残る場合は配送をブロックする（案A）。ただしブロック判定の直前に sync を実行して PR 状態を最新化し、ボードが古いだけの誤検知を防ぐ。
      規則上カードは全 change が done になってから acceptance へ上がるため、ブロックは通常発火しない例外の安全網。発火経路は (1) 司令塔の誤り (2) 中止された change (3) Kanban のドラッグで acceptance を飛ばした場合 (4) sync 未実行でボードが古い場合。(4) は同期先行で解消する。
      方針: ロジックは change.ts の deliverCard()（標準出力に書かない関数）に置き、change.sh deliver とサーバーの done 検知の両方から呼ぶ。案(a)主経路+案(b)実装形。案(c)は司令塔が SSE を購読する常駐機構が必要で却下。
      サーバーは mutateBoard の応答後にバックグラウンドで配送し、結果を SSE の delivery イベントで配信する。コールバック内で呼ぶとロック再入で BoardLockError になるため禁止（コメントとテストで固定）。
      同一内容の判定は git diff --quiet（コミット数では判定しない）。実測で origin/main..origin/overlord-console は10コミット先行だが diff は空（squash マージのため）。
      既存 PR がある場合はタイトルを変えず、<!-- overlord:card ID --> マーカーで囲んだカード単位セクションを本文に追加・置換する。
      base は refs/remotes/origin/HEAD → gh repo view → main の3段フォールバック。作成後に headRefName/baseRefName を検証し不一致ならボードを書かず失敗。
  - id: "OV-104"
    project: "Overlord"
    title: "ボードの同時書き込みで更新が消えないようにする"
    state: "implementing"
    priority:
      impact: 4
      urgency: 3
      confidence: 5
      ease: 3
      override: null
    evidence: |-
      server.ts の patchItem/deleteItem/setCommander は loadBoard(208) → rev 比較(209) → saveBoard(224) の間に revision を再確認しない。競合窓は実測 0.4〜2ms。
      追加で判明した欠陥2件: (1) createItem(248-271) には rev 比較自体が無く常に後勝ちで全体を上書きする。(2) フロントの PATCH 呼び出しは await されていないため、同一プロセス内で重なった2本の PATCH でも先の変更が消える。
      revisionOf は round(mtimeMs):size で、stat がナノ秒精度を返せるのに 1ms に丸めている。同一ミリ秒・同一サイズの書き込みは 409 判定と SSE 通知の両方で取りこぼす。
      CLI 側（change.ts の updateChange）だけが保存直前の revision 再取得を持つ。守られていないのはサーバー側。
      追記: PR #7 は 36db539 の時点でマージされ、その後に push したレビュー修正 08a44af が取り込まれないまま残った。指摘された3件（.gitignore の *.lock が bun.lock を巻き込む・デッドラインが実時間・ロックの pid を読まない）は main に未反映。OV-104-C3 で回収する。
    acceptance_conditions:
      - "コンソールの PATCH と CLI の書き込みを100回競合させて、CLI の書き込みが消えるケースが0件（競合時は 409 になる）"
      - "同じ rev の PATCH を2本同時発行したとき、片方が 200・片方が 409 になり、消失が起きない"
      - "異なる内容で同一バイト長のファイルを同一ミリ秒内に2回書いて、revisionOf の戻り値が異なる"
      - "同一条件の書き込みが SSE の board イベントとして配信される"
      - "rev 形式変更後も typecheck と既存の change.test.ts が通る"
    out_of_scope: "board.yaml のスキーマ変更（rev カウンタ導入を含む）、CLI のコマンド体系や updateChange の再設計、HTTP API の形の変更、複数サーバーインスタンスの排他、競合時の UI 改善"
