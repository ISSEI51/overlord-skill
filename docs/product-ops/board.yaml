  - id: "OV-CON-003"
    project: "Overlord"
    title: "画面取得をポーリングからイベント購読へ置き換えられるか調べる"
    state: "discovery"
    priority:
      impact: 3
      urgency: 1
      confidence: 2
      ease: 2
      override: null
    evidence: |-
      現在はカードを開いている間、1.5秒ごとに cmux read-screen をプロセス起動で実行している。
      cmux capabilities には terminal.bytes.v1、terminal.render_grid.v1、events.v1 があり、
      購読方式に置き換えられる可能性があるが、CLI からの購読手段は未確認。
    acceptance_conditions:
      - "cmux CLI またはソケットから端末更新を購読できるかどうかを、実行結果付きで判定できる"
    out_of_scope: "実装そのもの"
    owner: null
    next_action: "cmux events と rpc の端末系メソッドで購読可否を確認する"
