items:
  - id: "OV-CON-003"
    project: "Overlord"
    title: "端末ミラー取得をソケット直結+イベントトリガー化する"
    state: "acceptance"
    priority:
      impact: 3
      urgency: 1
      confidence: 2
      ease: 2
      override: null
    evidence: |-
      discovery 完了（サブエージェント実測）: 端末出力そのものを購読する手段は cmux に存在しない（events ストリームに端末出力イベントは流れない、terminal.* にストリーム系メソッドなし、render_revision も出力で不変 — すべて実測）。ただし events.stream は購読可能で、対象 surface の活動を示す間接イベント（agent.hook.*、surface.key_sent 等）は取れる。
      修正後の採用案: (1) read-screen のプロセス起動（40回/分）を UNIX ソケット直結の surface.read_text に置換、(2) events.stream の常駐購読をトリガーに即時再取得（300ms デバウンス）、(3) フォールバックポーリングを 1.5秒→10秒に緩和。純イベント購読のみは実現不可のため主従逆転の構成とする。
    acceptance_conditions:
      - "端末ミラー取得で cmux CLI の子プロセス起動が定常的に発生しない（ソケット直結）"
      - "司令塔で活動があった際、1秒以内にミラーへ反映される"
      - "イベントに乗らない出力変化も最大10秒で反映される（フォールバック）"
      - "cmux 再起動・ソケット切断後に自動で再接続し、ミラーが復旧する"
    out_of_scope: "端末出力の完全な購読（cmux 側に機構がなく不可能）、フロントの表示仕様変更"
    owner: "user"
    next_action: "サーバー再起動後、ミラーの即時反映を体感して受け入れる"
    blocker: null
    updated_at: "2026-08-27T15:40:00Z"
    brief: "方針: 新規 cmux-socket.ts（Bun.connect の UNIX ソケット NDJSON クライアント、コマンド用+購読用の2接続、指数バックオフ再接続、boot_id/gap 検知、応答エンベロープ ok/result/error は実測で確定）。readScreen を surface.read_text の RPC に置換 — 実測で lines=N がスクロールバック末尾 N 行を返し CLI と4通りバイト単位一致（OV-CON-002 の HTTP 契約はそのまま維持、CLI フォールバックはソケット不通時と起動時セルフチェック不合格時の保険）。サーバーは events.stream を購読し 300ms デバウンスで SSE の activity 通知（本文送らずフロント即時 pull）。フォールバックポーリング 1.5s→10s。変更5ファイル・新規依存なし。サイズ M。実装順 003→002 確定。ロールバックは revert のみ。"
    review: "実装エージェントの実測: ソケット接続2本、socket/CLI のバイト単位一致（scrollback 契約維持）、40リクエスト中 CLI 起動0、デバウンス動作。司令塔の追加検証: サーバー経由30リクエストで CLI 起動0（ps 50ms サンプリング）、activity フレームの end-to-end 配信（実セッションのフックイベント→SSE、surface_id 付き）を確認。実測差異: 素の端末出力はイベント非発生（エージェント活動のみ即時、素の出力は10秒ポーリングが安全網）。未確認: cmux 再起動時の再接続（コードレビューのみ、通常運用で自然に検証される）。コミット 7c64534 マージ済み。反映にはサーバー再起動が必要。"
