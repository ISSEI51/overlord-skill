    brief: |-
      方針: console/src/change.ts に change ライフサイクル専用の Bun CLI を1本追加し、スキル文面をそのコマンドへ向ける。
      サーバー・フロントは変更しない（表示は実装済み、同期は board.yaml の mtime 監視→SSE で自動反映されるため）。
      規約: ブランチ overlord/<change-id>、worktree <repo>/.overlord/worktrees/<change-id>、PR の base は既定でメインの現在ブランチ（--base で上書き）。
      Agent tool の isolation:"worktree"（自動ブランチ名 worktree-agent-*）は change 実装に使わず、change.sh start が作った worktree を cmux new-workspace で開く。
      PR 状態同期はサーバー常駐ジョブや同期ボタンではなく CLI 1コマンド（最小実装）。純関数と I/O を分け、後から POST /api/pr/sync を足す場合も呼び出し1行で済む形にする。
      reviewed_sha は独立レビュー担当が「blocking finding なし」と結論した時点で、実際に読んだ commit を書く（司令塔が後から書くとレビュー後の commit を掴むため）。sync が head_sha != reviewed_sha を警告し、マージ前ゲートになる。
      gh は使用可（2.89.0 / 認証済み / repo scope）。不在・失効時は CLI が非ゼロ終了しボードを一切書かず、--number による手動記録に退避する。
      リスク: CLI はサーバーの rev 楽観ロックを経由しないため、保存直前に revision を取り直し、変化していたら1回だけ再読込して対象 change のフィールドだけ再適用する。
    review: |-
      4 changes すべてが独立レビューを通過し PR #3/#4/#6 としてマージ済み。
      受け入れ条件1〜3 は実データで実証（start がブランチ生成、pr が #3/#4/#6 を作成、sync がマージを検知して change を done 化）。
      条件4 は C4 のレビュー commit 86fce74 を reviewed_sha に記録して充足。head_sha と一致（レビュー後の追加コミットなし）。
      条件5 はカードが OV-103 の1枚のまま、change 4件で完了。
      レビューが実害のある欠陥を2件捕捉: (a) pr --number の打ち間違いで無関係な PR が記録される（C2 で修正）、(b) sync が別ブランチの PR で board を上書きする（C4 で修正、いずれも再現・修正確認済み）。
      次の change への申し送り: reviewed の gh フォールバックに headRefName 検証がない、reviewed を worktree 内で実行すると worktree 側の board を書く、console.md の「A failure leaves board.yaml untouched」が sync の部分失敗と矛盾。
