    updated_at: "2026-08-27T23:20:00Z"
    brief: |-
      採用案: board.ts に共通の書き込み口を作り、(i) プロセス内直列化 (ii) ロック内で loadBoard (iii) expectedRev 突き合わせ (iv) saveBoard を通す。あわせて revisionOf を mtimeNs:size に変更する（rev は不透明文字列として扱われており非互換なし — フロント・CLI とも等値比較のみであることを確認済み）。
      保存直前の再確認だけでは窓が 0.4〜2ms → 0.2〜1ms に縮むだけで「必ず 409」を保証できないため、ロックファイル（O_EXCL + 失効時間）まで入れて board.ts 経由の書き込みを直列化する。
      server.ts はモジュール読み込み時に引数解析と Bun.serve を実行する構造でテストの継ぎ目が無い。ロックがあれば「テストがロックを保持した状態で PATCH が 409 を返す」決定的なテストが書ける。
    review: |-
      OV-104-C1 独立レビュー（実測中心・PR #5 マージ済み）:
      条件1（プロセス間競合で CLI の書き込みが消えない／409）は FAIL。750ラウンドで 409 は0件、CLI 書き込み消失 2〜3%、コンソール書き込みの巻き戻しは 17〜49%（ボードが大きいほど窓が広がる）。C1 は同一プロセス内のみを守る。
      条件2〜5 は PASS。同一プロセス内は明確な改善（base は同条件で1ラウンド目に board.yaml を破損させ以降50/50が500、head は 200/409 で消失0）。revision 粒度は 2627ペアすべてで衝突0。
      追加で判明した重大事項: saveBoard の一時ファイル名が固定（<path>.overlord-tmp）のため、2プロセス同時書き込みの 92〜97% で片方が rename ENOENT で失敗し、board.yaml 全体の破損（NUL埋め・パース不能）を実際に1件再現。破損後はサーバーの全書き込みが 500 になり手で直すまで復旧しない。
      レビュー後の追加コミット 63e71f4 は、レビュー担当が指摘した誤ったコメント（プロセス間も expectedRev で捕捉される、という記述）の修正のみ。マージゲートが警告を出したうえで司令塔が差分を確認して判断した。
